<!--catalog/base.html-->
<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/media/images/favicon.png" type="image/png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My site{% endblock %}</title>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://arty525.github.io/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #D0D0D0FF">
<div class="container" style="background-color: white">
  <div class="row">
    <!--left column-->
    <div class="col-1" style="width:10%; min-height:100vh; background-color: #212f3c; position: fixed; transfom: none">
      <!--header-->
      {% block header %}
      <div class="row" style="align-items: center;">
        <div class="col-4">
          <img src="https://arty525.github.io/img/logo.png" alt="Logo" height="50">
        </div>
        <div class="col-4">
          <font style="color:white; font-size: 20pt;">ARTY</font>
        </div>
      </div>
      <hr style="color: white">
      {% endblock %}
      <!--/header-->
      <!--menu-->
      {% include 'catalog/menu.html' %}
      <!--/menu-->
      <!--profile-->
      {% block profile %}
      <div class="dropup-center dropup" align="center" style="min-width: 155px;">
        <hr style="color:white;">
        {% if user.is_authenticated %}
        <button class="btn btn-outline-light" style="width: 160px;" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          <img src="{% if user.avatar %}{{ user.avatar.url }}{% else %}/media/images/noimage.png{% endif %}" width="35" height="35" style="border-radius: 100%" class="aspect-cropped">
          <style>
            .aspect-cropped {
              height: 35px;
              object-fit: cover;
              border-radius: 5px 5px 0 0;
            }
          </style>
          {{ user.username }}
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="{% url 'users:profile' user.pk %}">Профиль</a></li>
          <form method="post" action="{% url 'users:logout' %}">
            {% csrf_token %}
            <li><button class="dropdown-item" type="submit" >Выход</button></li>
          </form>
        </ul>
        {% else %}
        <a class="btn btn-primary" href="{% url 'users:login' %}" role="button">Войти</a>
        {% endif %}
      </div>
      {% endblock %}
      <!--/profile-->
    </div>
    <!--/left column-->
    <!--right column-->
    <div class="col" style="min-height: 100vh; position: relative; margin-left: 15%" align="center">
      {% block content %}
      {% endblock %}
      {% block footer %}
      <div style="position: absolute; bottom: 15px; right: 25px">
        <font color="gray">Create by <a href="https://github.com/Arty525" class="link-info link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover" target="blank">Andrey Egorov</a></font>
      </div>
      {% endblock %}
    </div>
    <!--/right column-->
  </div>
</div>
</body>
</html>
