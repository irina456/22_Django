<!--catalog/base.html-->
<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/media/images/favicon.png" type="image/png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My site{% endblock %}</title>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://arty525.github.io/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #D0D0D0FF">
<div class="container" style="background-color: white">
  <div class="row">
    <!--left column-->
    <div class="col-1" style="width:15%; min-height:100vh; background-color: #212f3c; padding-left: 20px;">
      <!--header-->
      {% block header %}
      <div class="row" style="align-items: center;">
        <div class="col-4">
          <img src="https://arty525.github.io/img/logo.png" alt="Logo" height="50">
        </div>
        <div class="col-4">
          <font style="color:white; font-size: 20pt;">ARTY</font>
        </div>
      </div>
      <hr style="color: white">
      {% endblock %}
      <!--/header-->
      <!--menu-->
      {% include 'catalog/menu.html' %}
      <!--/menu-->
      <!--profile-->
      {% block profile %}
      <div class="dropup-center dropup" style="position: absolute; bottom: 15px;">
        <hr style="color:white;">
        <button class="btn btn-outline-light" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          <img src="https://arty525.github.io/img/avatar.jpg" width="35" style="border-radius: 100%">
          Пользователь
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#">Профиль</a></li>
          <li><a class="dropdown-item" href="#">Выход</a></li>
        </ul>
      </div>
      {% endblock %}
      <!--/profile-->
    </div>
    <!--/left column-->
    <!--right column-->
    <div class="col" style="width:85%; min-height: 100vh;" align="center">
      {% block content %}
      {% endblock %}
      {% block footer %}
      <div style="position: absolute; bottom: 15px; right: 15px;">
        <!--copyright-->

        <font color="gray">Create by <a href="https://github.com/Arty525" class="link-info link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover" target="blank">Andrey Egorov</a></font>

        <!--/copyright-->
      </div>
      {% endblock %}
    </div>
    <!--/right column-->
  </div>
</div>
</body>
</html>
