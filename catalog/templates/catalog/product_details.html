{% extends 'catalog/base.html' %}
{% block title %}{{ product.name }}{% endblock %}
{% block content %}
<img height="250px" src="{% if product.image %}{{ product.image.url }}{% else %}/media/images/noimage.png{% endif %}" alt="Фото товара">
<br>
<h1>{{ product.name }}</h1>
<h3> Категория: {{ product.category }}</h3>
<h3>{{ product.price }}</h3>
<p>{{ product.description }}</p>
<div class="btn-group" role="group" aria-label="Basic outlined example">
    <a href="{% url 'catalog:edit_product' product.pk %}"  type="button" class="btn btn-outline-primary">Редактировать</a>
    <a href="{% url 'catalog:delete_product' product.pk %}" type="button" class="btn btn-outline-danger">Удалить</a>
</div>
{% endblock %}
