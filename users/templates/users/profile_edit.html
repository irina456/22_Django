{% extends 'catalog/base.html' %}
{% block title %}Изменение данных профиля{% endblock %}
{% block content %}
<div class="container text-center" style="margin-top: 20px;">
    <div class="row align-items-start">
        <div class="col" style="max-width: 200px">
            <h5>Текущий аватар:</h5>
            <img src="{% if user.avatar %}{{ user.avatar.url }}{% else %}/media/images/noimage.png{% endif %}" style="max-height: 350px; max-width: 200px">
            <br>
        </div>
        <div class="col" align="left" style="margin-left: 20px">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{% url 'users:profile' user.pk %}" type="button" class="btn btn-outline-secondary">Назад</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
