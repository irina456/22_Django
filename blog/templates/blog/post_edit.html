{% extends 'catalog/base.html' %}
{% block title %}Редактирование поста{% endblock %}
{% block content %}
<form method="post">
    {% csrf_token%}
    {{ form.as_p }}
    <div class="d-grid gap-2 d-md-block">
        <button class="btn btn-success" type="submit">Cохранить</button>
        <a href="{% url 'blogs:posts' %}" class="btn btn-danger" type="button">Отмена</a>
    </div>
</form>
{% endblock %}
